# ==============================================================================
# MEDINEX PRODUCTION SPRING PROFILE
# Activated automatically when SPRING_PROFILES_ACTIVE=prod
# Requires explicit environment secrets from hosting platform (fail-fast).
# ==============================================================================

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: native

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      keepalive-time: 120000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${PORT:${SERVER_PORT:8080}}}
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

medinex:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
  seed:
    enabled: ${MEDINEX_SEED_ENABLED:true}
    demo-users-enabled: false
    admin-password: ${SEED_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.medinex: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
